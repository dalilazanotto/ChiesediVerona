<!doctype html>

    <link rel="stylesheet" href="styles.css">

    <nav class="navbar navbar-expand-lg navbar-light bg-light p-4">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <a class="navbar-brand" href="#">Le Chiese Medievali di Verona</a>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Obiettivo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Catalogo</a>
            </li>
          </ul>
          <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
    <div class="container mt-4 mb-4">
      <h1>Duomo di Verona </h1>
      <div id="carouselDuomo" class="carousel slide">
        <div class="carousel-inner carousel-duomo-item">
          <div class="carousel-item active carousel-duomo-item">
            <img src="Andrea Mantegna.jpg" class="d-block w-100 carousel-duomo-img" alt="...">
          </div>
          <div class="carousel-item carousel-duomo-item">
            <img src="battistero.jpg" class="d-block w-100 carousel-duomo-img" alt="...">
          </div>
          <div class="carousel-item carousel-duomo-item">
            <img src="duomo-verona-3.jpg" class="d-block w-100 carousel-duomo-img" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselDuomo" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselDuomo" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mappa Chiese di Verona</title>
  <style>
    #map {
      height: 600px;
      width: 100%;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCzMt_76DISXjXKvQI1joDolEqqDFg2L1M"></script>
</head>
<body>
  <h1>Chiese medievali di Verona</h1>
  <div id="map"></div>

  <script>
    // Lista delle chiese con coordinate e link (solo il Duomo ha link alla pagina)
    var chiese = [
      {
        nome: "Duomo di Verona",
        lat: 45.4385,
        lng: 10.9916,
        info: "<div><h3>Duomo di Verona</h3><p>Clicca qui per aprire la pagina completa.</p></div>",
        link: "duomodiverona.html"
      },
      {nome: "Basilica di San Zeno", lat: 45.4380, lng: 10.9782, info: "Basilica di San Zeno"},
      {nome: "Chiesa di San Giorgio in Braida", lat: 45.4325, lng: 10.9940, info: "Chiesa di San Giorgio in Braida"},
      {nome: "Chiesa di Sant'Anastasia", lat: 45.4382, lng: 10.9925, info: "Chiesa di Sant'Anastasia"},
      {nome: "Chiesa di Sant’Eufemia", lat: 45.4450, lng: 10.9980, info: "Chiesa di Sant’Eufemia"},
      {nome: "Chiesa di Santo Stefano", lat: 45.4410, lng: 10.9935, info: "Chiesa di Santo Stefano"},
      {nome: "Chiesa di San Fermo", lat: 45.4390, lng: 10.9900, info: "Chiesa di San Fermo"},
      {nome: "Chiesa di Santa Maria in Organo", lat: 45.4370, lng: 10.9960, info: "Chiesa di Santa Maria in Organo"}
    ];

    var map = new google.maps.Map(document.getElementById('map'), {});
    var bounds = new google.maps.LatLngBounds();

    chiese.forEach(function(chiesa) {
      var marker = new google.maps.Marker({
        position: {lat: chiesa.lat, lng: chiesa.lng},
        map: map,
        title: chiesa.nome
      });

      var infoWindow = new google.maps.InfoWindow({
        content: chiesa.info
      });

      // Apri InfoWindow al click
      marker.addListener('click', function() {
        infoWindow.open(map, marker);

        // Se c'è un link associato, aprilo in una nuova scheda
        if (chiesa.link) {
          window.open(chiesa.link, "_blank");
        }
      });

      bounds.extend(marker.position);

      // Apri automaticamente la scheda del Duomo all'avvio
      if (chiesa.nome === "Duomo di Verona") {
        infoWindow.open(map, marker);
      }
    });

    map.fitBounds(bounds);
  </script>
</body>
</html>
